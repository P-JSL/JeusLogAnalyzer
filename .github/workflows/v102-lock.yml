name: Generate Rust Cargo.lock for v1.0.2 updater dependencies (temporary)
on:
  push:
    branches: [feature/remote-trace-auto-update-v1.0.2]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve updater TLS dependency into the lockfile
        run: cargo update --manifest-path rust/Cargo.toml
      - name: Commit updated locked dependency graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build(rust): resolve locked HTTPS updater dependencies'
            git push origin HEAD:feature/remote-trace-auto-update-v1.0.2
          fi
