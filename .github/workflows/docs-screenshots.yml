name: Capture README screenshots (one-time documentation task)
on:
  push:
    branches: [docs/readme-v1-guide]
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean UI font for readable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Capture real application screens with synthetic test data
        run: |
          test -x /usr/bin/chromium
          JEUS_LENS_DOC_SCREENSHOTS=1 node tests/ui-smoke.js
          test -s docs/images/01-file-import.png
          test -s docs/images/02-analysis-summary.png
          test -s docs/images/03-error-detail.png
          test -s docs/images/04-remote-sftp.png
      - name: Commit generated screenshots to documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/01-file-import.png docs/images/02-analysis-summary.png docs/images/03-error-detail.png docs/images/04-remote-sftp.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m 'docs: capture v1.0.0 application screenshots with synthetic logs'
            git push origin HEAD:docs/readme-v1-guide
          fi
