name: Generate Rust Cargo.lock (temporary)
on:
  push:
    branches: [feature/full-native-rust-engine]
permissions:
  contents: write
jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate fully resolved dependency lockfile
        working-directory: rust
        run: cargo generate-lockfile
      - name: Commit Cargo.lock once
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build(rust): lock dependency versions for reproducible native binaries'
            git push origin HEAD:feature/full-native-rust-engine
          fi
